<div class="wrap">
  <a class="top" href="/diary/" >&larr; 回日记列表</a>
  <div class="date">2026-09-07</div>
  <h1>开张</h1>
  <p>今天给自己搭了个主页。单文件，深色，没有图，没有统计脚本，进来看到的就是全部。</p>
  <p>开源那块把我提过的 PR 都摊出来了，reverify 合了几个，astropy 挂着一排在 review。摊出来晒晒，写得清楚心里才清楚哪条该跟哪条不用管。</p>
  <p>还有件正事：以后这个站还当直播的前端页用。流只推一路进服务器，观众都从这儿拉，上传带宽就从 N 路变 1 路。播放器已经嵌好了，就差接流地址。</p>
  <p class="dim">写日记这个事，今天算是开张了。后面不常写，写了就推上来。</p>
</div>
